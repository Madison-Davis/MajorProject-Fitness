<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Progress</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <main>

    <section class="chart-block">
      <h2>Progression per exercise</h2>
      <select id="chart1-exercise-select" style="width:100%; height:40px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin:10px 0; color:var(--text); padding:0 10px;"></select>
      <div class="toggle-group" id="chart1-metric-toggle">
        <button data-value="volume" class="active">Volume</button>
        <button data-value="weight">Max weight</button>
      </div>
      <canvas id="chart1-canvas"></canvas>
    </section>

    <section class="chart-block">
      <h2>Muscle % breakdown</h2>
      <div class="toggle-group" id="chart2-range-toggle" style="margin-top:10px;">
        <button data-value="week" class="active">Week</button>
        <button data-value="month">Month</button>
        <button data-value="all">All-time</button>
      </div>
      <canvas id="chart2-canvas"></canvas>
    </section>

    <section class="chart-block">
      <h2>Avg sets per muscle group</h2>
      <div class="toggle-group" id="chart3-range-toggle" style="margin-top:10px;">
        <button data-value="week" class="active">Week</button>
        <button data-value="month">Month</button>
        <button data-value="all">All-time</button>
      </div>
      <canvas id="chart3-canvas"></canvas>
    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/charts.js"></script>
</body>
</html>
