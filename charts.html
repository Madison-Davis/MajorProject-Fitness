<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Progress</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <main>

    <section class="summary-panel">
      <h2>Summary</h2>
      <div id="summary-root"></div>
    </section>

    <section class="chart-box">
      <h2>Volume progression — every exercise</h2>
      <div class="toggle-group" id="chart1-metric-toggle">
        <button data-value="volume" class="active">Volume</button>
        <button data-value="weight">Max weight</button>
      </div>
      <canvas id="chart1-canvas"></canvas>
      <div class="legend" id="chart1-legend"></div>
    </section>

    <section class="chart-box">
      <h2>Muscle % breakdown</h2>
      <div class="toggle-group" id="chart2-range-toggle">
        <button data-value="week" class="active">Week</button>
        <button data-value="month">Month</button>
        <button data-value="all">All-time</button>
      </div>
      <canvas id="chart2-canvas" style="height:200px;"></canvas>
      <div class="legend" id="chart2-legend"></div>
    </section>

    <section class="chart-box">
      <h2>Avg sets per muscle group</h2>
      <div class="toggle-group" id="chart3-range-toggle">
        <button data-value="week" class="active">Week</button>
        <button data-value="month">Month</button>
        <button data-value="all">All-time</button>
      </div>
      <canvas id="chart3-canvas" style="height:260px;"></canvas>
    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/charts.js"></script>
</body>
</html>
