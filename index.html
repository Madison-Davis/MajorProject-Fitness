<!doctype html>
<html lang="en">
<head>
<!--
  LIFT: a single-file gym logger (installable web app).

  FILE MAP
    1. HEAD        meta tags for full-screen iPhone use
    2. STYLES      design tokens, base, layout, components, charts
    3. MARKUP      Log tab, History tab, Charts tab, bottom nav
    4. SCRIPT      helpers, data, rendering, UI wiring, timer, GitHub sync, PWA setup, startup

  DATA
    Stored in the browser's localStorage under the key "lift".
    Each set looks like: { id, t, ex, w, r }
      id = unique number, t = timestamp (ms), ex = exercise name, w = weight, r = reps
    The GitHub token is stored under the key "lift-token".
-->

<!-- ============================== 1. HEAD ============================== -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#101418">
<title>Lift</title>

<!-- ============================= 2. STYLES ============================= -->
<style>
  /* ---- Design tokens: change colors here ---- */
  :root {
    --bg: #101418;      /* page background */
    --sf: #1a2027;      /* cards and nav bar */
    --ln: #2a323b;      /* borders and dividers */
    --tx: #e8ecef;      /* main text */
    --mu: #8a95a0;      /* muted text */
    --ac: #5cc8ff;      /* accent (buttons, charts) */
    --rd: #ff7a7a;      /* timer finished */
  }

  /* ---- Base ---- */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--tx);
    font: 16px -apple-system, system-ui, sans-serif;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  body { padding-top: env(safe-area-inset-top); }   /* clears the notch */
  main {
    max-width: 560px;
    margin: auto;
    padding: 16px 16px calc(88px + env(safe-area-inset-bottom));  /* room for the nav bar */
  }
  h2 { font-size: 20px; margin: 0 0 12px; }
  h3 { font-size: 15px; color: var(--mu); font-weight: 600; margin: 20px 0 8px; }
  .mu { color: var(--mu); font-size: 14px; }

  /* ---- Tabs (only the one with class "on" is visible) ---- */
  .tab { display: none; }
  .tab.on { display: block; }

  /* ---- Cards, form fields, buttons ---- */
  .card {
    background: var(--sf);
    border: 1px solid var(--ln);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  label.l { display: block; font-size: 13px; color: var(--mu); margin: 0 0 4px; }
  input, select {
    width: 100%;
    background: var(--bg);
    color: var(--tx);
    border: 1px solid var(--ln);
    border-radius: 8px;
    padding: 12px;
    font-size: 16px;               /* 16px+ stops iOS from zooming on focus */
    font-family: inherit;
  }
  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 8px;
    padding: 12px;
    background: var(--ln);
    color: var(--tx);
  }
  button.p  { background: var(--ac); color: #06202e; }   /* primary button */
  button.on { outline: 2px solid var(--ac); }            /* selected preset */
  .full { width: 100%; margin-top: 8px; }

  /* ---- Set rows (used in Today and History) ---- */
  .set {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-top: 1px solid var(--ln);
  }
  .set:first-child { border-top: 0; }
  .set b { font-weight: 600; }
  .set span { color: var(--mu); font-size: 14px; }
  .x { background: none; color: var(--mu); padding: 4px 10px; font-size: 20px; }  /* delete button */

  /* ---- Rest timer ---- */
  #clock {
    font-size: 56px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
    margin: 4px 0 10px;
  }
  #timer.done #clock { color: var(--rd); }

  /* ---- Bottom navigation ---- */
  nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    background: var(--sf);
    border-top: 1px solid var(--ln);
    padding-bottom: env(safe-area-inset-bottom);   /* clears the home indicator */
  }
  nav button { flex: 1; background: none; border-radius: 0; padding: 16px 0; color: var(--mu); }
  nav button.on { color: var(--ac); outline: 0; }

  /* ---- Charts ---- */
  svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--mu); font-size: 10px; }
</style>
</head>

<body>
<!-- ============================= 3. MARKUP ============================= -->
<main>

  <!-- ---------- LOG TAB: timer, add-a-set form, today's sets ---------- -->
  <section class="tab on" id="t-log">

    <!-- Rest timer -->
    <div class="card" id="timer">
      <div id="clock">0:00</div>
      <div class="row" id="presets"></div>   <!-- preset buttons are added by the script -->
      <div class="row" style="margin-top:8px">
        <button class="p" id="go">Start</button>
        <button id="stop">Reset</button>
      </div>
      <label class="mu" style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <input type="checkbox" id="auto" checked style="width:auto">
        Start timer when I add a set
      </label>
    </div>

    <!-- Add-a-set form -->
    <div class="card">
      <label class="l" for="ex">Exercise</label>
      <input id="ex" list="exl" autocomplete="off" placeholder="Bench press">
      <datalist id="exl"></datalist>         <!-- autocomplete from past exercises -->
      <div class="row" style="margin-top:10px">
        <div>
          <label class="l" for="w">Weight</label>
          <input id="w" inputmode="decimal" placeholder="135">
        </div>
        <div>
          <label class="l" for="r">Reps</label>
          <input id="r" inputmode="numeric" placeholder="8">
        </div>
      </div>
      <button class="p full" id="add" style="margin-top:12px">Add set</button>
    </div>

    <!-- Today's sets -->
    <h3>Today</h3>
    <div class="card" id="today"></div>
  </section>

  <!-- ---------- HISTORY TAB: all sets, GitHub sync, export ---------- -->
  <section class="tab" id="t-hist">
    <h2>History</h2>
    <div id="hist"></div>
    <button class="p full" id="sync">Sync with GitHub</button>
    <div class="mu" id="syncmsg" style="margin:8px 0"></div>   <!-- sync status messages -->
    <button class="full" id="tok">Set GitHub token</button>
    <button class="full" id="exp">Export backup (JSON)</button>
  </section>

  <!-- ---------- CHARTS TAB: sets per week, progression ---------- -->
  <section class="tab" id="t-chart">
    <h2>Charts</h2>
    <div class="card">
      <div style="font-weight:600">Sets per week</div>
      <div class="mu" id="avg"></div>
      <div id="bars"></div>
    </div>
    <div class="card">
      <div style="font-weight:600;margin-bottom:8px">Progression</div>
      <select id="cx"></select>
      <div class="mu" style="margin-top:8px">Best estimated 1-rep max per day</div>
      <div id="line"></div>
    </div>
  </section>
</main>

<!-- Bottom tab bar -->
<nav>
  <button data-t="log" class="on">Log</button>
  <button data-t="hist">History</button>
  <button data-t="chart">Charts</button>
</nav>

<!-- ============================= 4. SCRIPT ============================= -->
<script>
/* ---------------------------------------------------------------
   4.1  HELPERS
   --------------------------------------------------------------- */
const $ = s => document.querySelector(s);

// Local date as YYYY-MM-DD
const day = t => new Date(t).toLocaleDateString('en-CA');

// Timestamp of the Monday (midnight) that starts the week containing t
const weekStart = t => {
  const d = new Date(t);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return d.getTime();
};

// Estimated 1-rep max (Epley formula)
const est1RM = s => s.r <= 1 ? s.w : s.w * (1 + s.r / 30);

// Escape text before putting it into HTML
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Format seconds as m:ss
const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');


/* ---------------------------------------------------------------
   4.2  DATA (load and save)
   --------------------------------------------------------------- */
let D = [];   // every logged set
try { D = JSON.parse(localStorage.getItem('lift') || '[]'); } catch (e) {}

const save = () => {
  try { localStorage.setItem('lift', JSON.stringify(D)); } catch (e) {}
};

// Sorted list of unique exercise names
const exerciseNames = () => [...new Set(D.map(s => s.ex))].sort();


/* ---------------------------------------------------------------
   4.3  RENDERING
   --------------------------------------------------------------- */

// One row in a list of sets
function setRow(s) {
  return `<div class="set">
    <div><b>${esc(s.ex)}</b><br><span>${s.w} × ${s.r}</span></div>
    <button class="x" data-del="${s.id}" aria-label="Delete set">×</button>
  </div>`;
}

// Redraw the Log and History tabs, then the charts
function render() {
  // Autocomplete list
  $('#exl').innerHTML = exerciseNames().map(n => `<option value="${esc(n)}">`).join('');

  // Today's sets, newest first
  const today = D.filter(s => day(s.t) === day(Date.now())).reverse();
  $('#today').innerHTML = today.length
    ? today.map(setRow).join('')
    : '<span class="mu">No sets yet. Add your first one above.</span>';

  // History grouped by day, newest first
  const byDay = {};
  D.slice().reverse().forEach(s => (byDay[day(s.t)] = byDay[day(s.t)] || []).push(s));
  $('#hist').innerHTML = Object.keys(byDay).map(k => {
    const label = new Date(k + 'T12:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    return `<h3>${label}</h3><div class="card">${byDay[k].map(setRow).join('')}</div>`;
  }).join('') || '<span class="mu">Nothing logged yet.</span>';

  renderCharts();
}

// Bar chart (sets per week) and line chart (progression)
function renderCharts() {
  /* --- Sets per week: last 8 weeks --- */
  const thisWeek = weekStart(Date.now());
  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const d = new Date(thisWeek);
    d.setDate(d.getDate() - 7 * i);
    const k = d.getTime();
    weeks.push({ k, n: D.filter(s => weekStart(s.t) === k).length });
  }

  const active = weeks.filter(x => x.n > 0);
  $('#avg').textContent = active.length
    ? `Average ${(active.reduce((a, b) => a + b.n, 0) / active.length).toFixed(1)} sets/week over weeks with training (last 8 weeks)`
    : 'No data yet';

  const max = Math.max(1, ...weeks.map(x => x.n));
  $('#bars').innerHTML = `<svg viewBox="0 0 320 140">${weeks.map((x, i) => {
    const h = x.n / max * 100, X = 10 + i * 38, d = new Date(x.k);
    return `<rect x="${X}" y="${110 - h}" width="28" height="${h}" rx="4" fill="#5cc8ff"/>
            <text x="${X + 14}" y="${104 - h}" text-anchor="middle">${x.n || ''}</text>
            <text x="${X + 14}" y="128" text-anchor="middle">${d.getMonth() + 1}/${d.getDate()}</text>`;
  }).join('')}</svg>`;

  /* --- Progression: best estimated 1RM per day for the chosen exercise --- */
  const select = $('#cx'), previous = select.value;
  select.innerHTML = exerciseNames().map(n => `<option${n === previous ? ' selected' : ''}>${esc(n)}</option>`).join('');

  const best = {};   // date -> best e1RM that day
  D.filter(s => s.ex === select.value).forEach(s => {
    best[day(s.t)] = Math.max(best[day(s.t)] || 0, est1RM(s));
  });
  const dates = Object.keys(best).sort();

  if (dates.length < 2) {
    $('#line').innerHTML = '<span class="mu">Log this exercise on at least two days to see progression.</span>';
    return;
  }

  const vals = dates.map(k => best[k]);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v, i) => [20 + i * (280 / (vals.length - 1)), 120 - (v - lo) / span * 90]);

  $('#line').innerHTML = `<svg viewBox="0 0 320 150">
    <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#5cc8ff" stroke-width="2.5"/>
    ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#5cc8ff"/>`).join('')}
    <text x="4" y="30">${Math.round(hi)}</text>
    <text x="4" y="124">${Math.round(lo)}</text>
    <text x="20" y="144">${dates[0].slice(5)}</text>
    <text x="300" y="144" text-anchor="end">${dates[dates.length - 1].slice(5)}</text>
  </svg>`;
}


/* ---------------------------------------------------------------
   4.4  UI WIRING (tabs, add, delete, export)
   --------------------------------------------------------------- */

// Tab switching and delete buttons (one listener for the whole page)
document.addEventListener('click', e => {
  const delId = e.target.dataset.del;
  if (delId) {
    D = D.filter(s => s.id != delId);
    save();
    render();
  }

  const tab = e.target.closest('nav button');
  if (tab) {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.id === 't-' + tab.dataset.t));
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b === tab));
    scrollTo(0, 0);
  }
});

// Changing the chart's exercise redraws the charts
$('#cx').onchange = renderCharts;

// Picking an exercise prefills your last weight and reps for it
$('#ex').onchange = () => {
  const last = D.filter(s => s.ex === $('#ex').value.trim()).pop();
  if (last) { $('#w').value = last.w; $('#r').value = last.r; }
};

// Add a set
$('#add').onclick = () => {
  const ex = $('#ex').value.trim();
  const w = parseFloat($('#w').value);
  const r = parseInt($('#r').value);
  if (!ex || isNaN(w) || isNaN(r)) { alert('Enter an exercise, weight, and reps.'); return; }

  D.push({ id: Date.now(), t: Date.now(), ex, w, r });
  save();
  render();
  if ($('#auto').checked) startTimer();
};

// Download all data as a JSON file
$('#exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(D)], { type: 'application/json' }));
  a.download = 'lift-backup-' + day(Date.now()) + '.json';
  a.click();
};


/* ---------------------------------------------------------------
   4.5  REST TIMER
   Uses an end timestamp, so it stays accurate if the screen locks.
   --------------------------------------------------------------- */
let restSeconds = 90;   // selected preset
let endTime = 0;        // 0 = not running
let audioCtx;

// Preset buttons
$('#presets').innerHTML = [60, 90, 120, 180]
  .map(s => `<button data-p="${s}" class="${s === restSeconds ? 'on' : ''}">${fmt(s)}</button>`)
  .join('');

$('#presets').onclick = e => {
  const p = e.target.dataset.p;
  if (!p) return;
  restSeconds = +p;
  document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  if (!endTime) $('#clock').textContent = fmt(restSeconds);
};

function startTimer() {
  // Audio must be created after a tap, or iOS blocks it
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  endTime = Date.now() + restSeconds * 1000;
  $('#timer').classList.remove('done');
}

function beep() {
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.value = 0.2;
    o.frequency.value = 880;
    o.start();
    o.stop(audioCtx.currentTime + 0.4);
  } catch (e) {}
}

$('#go').onclick = startTimer;
$('#stop').onclick = () => {
  endTime = 0;
  $('#timer').classList.remove('done');
  $('#clock').textContent = fmt(restSeconds);
};

// Update the display four times a second while running
setInterval(() => {
  if (!endTime) return;
  const left = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
  $('#clock').textContent = fmt(left);
  if (!left) { endTime = 0; $('#timer').classList.add('done'); beep(); }
}, 250);

$('#clock').textContent = fmt(restSeconds);


/* ---------------------------------------------------------------
   4.6  GITHUB SYNC
   Merges local sets with data.json in the private data repo.
   Sets with the same id count as the same set; everything else is added.
   Note: deletions do not sync (a deleted set returns on the next sync).
   --------------------------------------------------------------- */
const REPO = 'Madison-Davis/MajorProject-Fitness-Data';
const FILE = 'data.json';

const msg = t => $('#syncmsg').textContent = t;

// Base64 helpers that handle non-ASCII text and large files
const b64encode = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
  return btoa(bin);
};
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));

// Save the access token on this phone
$('#tok').onclick = () => {
  const t = prompt('Paste your GitHub token (kept only on this phone):');
  if (t) { localStorage.setItem('lift-token', t.trim()); msg('Token saved.'); }
};

$('#sync').onclick = async () => {
  const token = localStorage.getItem('lift-token');
  if (!token) { msg('Set your GitHub token first.'); return; }

  const headers = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };
  const url = `https://api.github.com/repos/${REPO}/contents/${FILE}`;
  msg('Syncing…');

  try {
    // 1. Download the current file (404 just means it doesn't exist yet)
    let remote = [], sha;
    const get = await fetch(url, { headers, cache: 'no-store' });
    if (get.ok) {
      const json = await get.json();
      sha = json.sha;
      remote = JSON.parse(b64decode(json.content));
    } else if (get.status !== 404) {
      throw new Error('GitHub returned ' + get.status);
    }

    // 2. Merge by id, oldest first, and save locally
    const merged = new Map();
    [...remote, ...D].forEach(s => merged.set(s.id, s));
    D = [...merged.values()].sort((a, b) => a.t - b.t);
    save();
    render();

    // 3. Upload the merged result
    const put = await fetch(url, {
      method: 'PUT',
      headers,
      body: JSON.stringify({ message: 'Sync ' + day(Date.now()), content: b64encode(JSON.stringify(D)), sha })
    });
    if (!put.ok) throw new Error('GitHub returned ' + put.status);

    msg('Synced. ' + D.length + ' sets total.');
  } catch (e) {
    msg('Sync failed: ' + e.message);
  }
};


/* ---------------------------------------------------------------
   4.7  PWA SETUP (home screen icon and offline support)
   --------------------------------------------------------------- */

// Draw a simple barbell icon and use it as the home screen icon
(() => {
  const c = document.createElement('canvas');
  c.width = c.height = 180;
  const x = c.getContext('2d');
  x.fillStyle = '#101418';
  x.fillRect(0, 0, 180, 180);
  x.fillStyle = '#5cc8ff';
  [[30, 82, 120, 16], [38, 52, 16, 76], [126, 52, 16, 76], [22, 68, 12, 44], [146, 68, 12, 44]]
    .forEach(r => x.fillRect(...r));
  const link = document.createElement('link');
  link.rel = 'apple-touch-icon';
  link.href = c.toDataURL();
  document.head.appendChild(link);
})();

// Service worker (sw.js) caches the app so it works offline
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});


/* ---------------------------------------------------------------
   4.8  STARTUP
   --------------------------------------------------------------- */
render();
</script>
</body>
</html>
